name: Report unresolved genealogy research

on:
  push:
    branches:
      - research/extensive-collateral-family-expansion
    paths:
      - .github/workflows/report-unresolved-research.yml

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: research/extensive-collateral-family-expansion
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Print unresolved targets and historical research candidates
        run: |
          python - <<'PY'
          from collections import defaultdict
          from pathlib import Path
          from family_data import RELATIONSHIP_FIELDS, load_site_data

          data = load_site_data(Path("data"))
          people = data["people"]
          known = {str(person["id"]) for person in people}
          refs = defaultdict(list)
          for person in people:
              for field in RELATIONSHIP_FIELDS:
                  for related in person.get(field, []):
                      related = str(related)
                      if related not in known:
                          refs[related].append((str(person.get("id")), str(person.get("full_name")), field))

          print("=== UNRESOLVED RELATIONSHIP TARGETS ===")
          for target in sorted(refs):
              print(target)
              for source_id, source_name, field in refs[target]:
                  print(f"  {field} of {source_id} | {source_name}")

          print("=== HISTORICAL PROFILES WITH EXPANSION POTENTIAL ===")
          for person in sorted(people, key=lambda p: str(p.get("birth_date") or "9999")):
              birth = str(person.get("birth_date") or "")
              year = int(birth[:4]) if len(birth) >= 4 and birth[:4].isdigit() else 9999
              if year > 1930:
                  continue
              spouses = person.get("spouses", [])
              children = person.get("children", [])
              if not spouses or not children:
                  print(
                      f"{person.get('id')} | {person.get('full_name')} | {birth or '?'} | "
                      f"parents={person.get('parents', [])} | spouses={spouses} | children={children}"
                  )

          event_refs = defaultdict(list)
          for event in data["events"]:
              for person_id in event.get("people_involved", []):
                  person_id = str(person_id)
                  if person_id not in known:
                      event_refs[person_id].append((str(event.get("id")), str(event.get("title")), str(event.get("date"))))

          print("=== UNRESOLVED EVENT TARGETS ===")
          for target in sorted(event_refs):
              print(target)
              for event_id, title, date in event_refs[target]:
                  print(f"  {event_id} | {date} | {title}")
          PY
