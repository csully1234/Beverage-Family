          )
          new_person(
              id='dorothy_beverage_brownell_1921', full_name='Dorothy B. Beverage Brownell',
              birth_date='1921-09-17', birth_date_precision='exact', birth_place='Camden, Maine', death_date='2012-11-13', death_date_precision='exact',
              parents=['elroy_victor_beverage_1896', 'marjorie_mank_beverage'], siblings=[], spouses=['frederick_w_brownell'], children=[],
              evidence_status='Verified — contemporary obituary directly names parents, husband, birth and death',
              research_completeness='Strong obituary record; living descendants intentionally not profiled',
              notes='Her obituary states Frederick died six weeks before her after 65 years of marriage.', sources=[dorothy_src]
          )
          new_person(
              id='frederick_w_brownell', full_name='Frederick W. Brownell', birth_date=None, death_date='2012', death_date_precision='year',
              parents=[], siblings=[], spouses=['dorothy_beverage_brownell_1921'], children=[],
              evidence_status='Strongly supported — Dorothy Brownell obituary identifies him as her husband of 65 years and reports his death six weeks before hers',
              research_completeness='Marriage/death context established; exact vital dates not asserted from cemetery-only evidence',
              sources=[dorothy_src]
          )
          new_person(
              id='estelle_nettie_beverage_libby_1922', full_name='Estelle Nettie Beverage Libby',
              birth_date='1922-10-09', birth_date_precision='exact', birth_place='Camden, Maine', death_date='2026-05-17', death_date_precision='exact',
              parents=['elroy_victor_beverage_1896', 'marjorie_mank_beverage'], siblings=[], spouses=['malcolm_plummer_libby'],
              children=['david_libby_estelle_branch', 'sylvia_jean_libby_soucier', 'cynthia_e_libby_tuplin_1952'],
              evidence_status='Verified with noted name conflict — obituary directly names parents, spouse, siblings and children; father appears as “Leroy” in this obituary while sibling obituaries independently identify Elroy',
              research_completeness='Immediate family and exact dates strong; original birth record would resolve the Leroy/Elroy transcription conflict',
              conflicting_evidence=[{'claim':'Father’s given name','source':'2026 Estelle obituary','reported':'Leroy Beverage','corroboration':'Dorothy and Hartley obituaries independently name the same father as Elroy V./Elroy Beverage Sr.','status':'Recorded as a source conflict; Elroy retained as the connected parent'}],
              notes='The obituary says Estelle and Malcolm raised seven children. Four living sons are not converted into public profiles; only deceased children are included.',
              sources=[estelle_src, dorothy_src, hartley_src]
          )
          new_person(
              id='malcolm_plummer_libby', full_name='Malcolm Plummer Libby', birth_date=None, death_date=None,
              parents=[], siblings=[], spouses=['estelle_nettie_beverage_libby_1922'], children=['david_libby_estelle_branch', 'sylvia_jean_libby_soucier', 'cynthia_e_libby_tuplin_1952'],
              evidence_status='Verified relationship — named as Estelle’s husband and as father by independent obituaries of Sylvia and Cynthia',
              research_completeness='Spouse/parent relationships established; vital dates remain open',
              notes='Living children are intentionally not profiled.', sources=[estelle_src, sylvia_src, cynthia_src]
          )
          new_person(
              id='david_libby_estelle_branch', full_name='David Libby', birth_date=None, death_date=None,
              parents=['malcolm_plummer_libby', 'estelle_nettie_beverage_libby_1922'], siblings=[], spouses=[], children=[],
              evidence_status='Verified deceased child — Estelle’s 2026 obituary names deceased son David; Cynthia’s 2023 obituary independently names deceased brother David',
              research_completeness='Relationship and deceased status established; identity-specific vital dates not yet safely isolated from other Maine David Libbys',
              sources=[estelle_src, cynthia_src]
          )
          new_person(
              id='sylvia_jean_libby_soucier', full_name='Sylvia Jean Libby Soucier', birth_date=None, death_date='2021-04-08', death_date_precision='exact', birth_place='Camden, Maine',
              parents=['malcolm_plummer_libby', 'estelle_nettie_beverage_libby_1922'], siblings=[], spouses=[], children=[],
              evidence_status='Verified — detailed obituary names both parents and exact death date',
              research_completeness='Parentage and death verified; exact birth date not inferred from age',
              notes='Her living spouse and children are not converted into public profiles.', sources=[sylvia_src, estelle_src, cynthia_src]
