name: Apply verified collateral family expansion

on:
  push:
    branches:
      - research/extensive-collateral-family-expansion
    paths:
      - .github/workflows/apply-collateral-expansion.yml

permissions:
  contents: write

jobs:
  research-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: research/extensive-collateral-family-expansion
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Apply verified research overlay
        run: python scripts/apply_collateral_expansion.py
      - name: Install dependencies
        run: python -m pip install --upgrade pip -r requirements.txt
      - name: Validate expanded archive
        run: |
          python -m compileall -q app.py family_data.py full_tree.py validation.py validate_data.py
          python validate_data.py
          python -m unittest discover -s tests -v
          git diff --check
      - name: Commit verified research and remove one-time helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-collateral-expansion.yml scripts/apply_collateral_expansion.py
          git add data/research_people.json research/collateral_family_expansion_2026-08-31.md
          git diff --cached --check
          git commit -m "Expand verified collateral Beverage family branches"
          git push origin HEAD:research/extensive-collateral-family-expansion

# rerun after making the research-growth test extensible
