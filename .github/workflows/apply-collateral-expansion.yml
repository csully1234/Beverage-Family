              output = []
              seen = set()
              for item in list(existing or []) + list(additions or []):
                  key = json.dumps(item, sort_keys=True, ensure_ascii=False) if isinstance(item, dict) else f"text:{item}"
                  if key not in seen:
                      seen.add(key)
                      output.append(item)
              return output

          def patch_existing(person_id, relation_additions, source_additions, note=None):
              current = effective(person_id)
              if not current:
                  raise SystemExit(f"Missing anchor profile: {person_id}")
              overlay = dict(research_by_id.get(person_id, {}))
              overlay["id"] = person_id
              for field, additions in relation_additions.items():
                  values = [str(v) for v in current.get(field, [])]
                  for value in additions:
                      if value not in values:
                          values.append(value)
                  overlay[field] = values
              overlay["sources"] = merge_sources(current.get("sources", []), source_additions)
              if note:
                  existing_note = str(current.get("notes") or "").strip()
                  if note not in existing_note:
                      overlay["notes"] = (existing_note + " " + note).strip()
              research_by_id[person_id] = overlay

