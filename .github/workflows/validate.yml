name: Validate family archive

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install runtime dependencies
        run: python -m pip install --upgrade pip -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q app.py family_data.py full_tree.py validation.py validate_data.py archive.py archive_ui.py archive_validation.py historical_map.py

      - name: Validate genealogy data
        run: python validate_data.py

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Set up Node for map interaction tests
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install map test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Test historical map interactions
        run: npm test
