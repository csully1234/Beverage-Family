name: Validate family archive

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install runtime dependencies
        run: python -m pip install --upgrade pip -r requirements.txt

      - name: Compile all Python sources, including new exhibit modules
        run: python -m compileall -q .

      - name: Audit public-source privacy and family login gate
        run: python -m tools.privacy_audit --out dist/privacy-audit.json

      - name: Validate genealogy data
        run: python validate_data.py

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Verify release assets and internal routes
        run: python tools/release_audit.py --out dist/release-audit.json

      - name: Set up Node for map interaction tests
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install map test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Test map and family-tree interactions
        run: npm test

  backup:
    name: Verified source backup (main)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out validated commit
        uses: actions/checkout@v4

      - name: Create checksum-verified recovery snapshot
        run: python tools/create_release_backup.py dist/family-release-backup.zip

      - name: Verify every saved file and perform a full restore drill
        run: |
          python -m tools.verify_release_backup dist/family-release-backup.zip --against-checkout . --restore-to dist/recovered-source --report dist/recovery-proof.json
          test -f dist/recovered-source/app.py
          test -f dist/recovered-source/data/people.json
          test -f dist/recovered-source/static/books/The_Colony_Lowell_Beveridge_2016_Web_Optimized.pdf
          test -f dist/recovered-source/.streamlit/config.toml
          test -f dist/recovered-source/schemas/archive.schema.json
          test -f dist/recovered-source/package.json
          test -f dist/recovered-source/package-lock.json

      - name: Upload verified recoverable site snapshot and restore report
        uses: actions/upload-artifact@v4
        with:
          name: family-release-backup-${{ github.sha }}
          path: |
            dist/family-release-backup.zip
            dist/recovery-proof.json
          retention-days: 90
          if-no-files-found: error
