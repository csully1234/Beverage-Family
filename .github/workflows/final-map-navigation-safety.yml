name: Final map navigation safety

on:
  push:
    branches:
      - final/family-archive-hardening
    paths:
      - .github/workflows/final-map-navigation-safety.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: final/family-archive-hardening
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Make full-map navigation session-safe
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path("app.py")
          text = app.read_text()
          old = '''    metrics[3].metric("Spouse links", len(spouse_edges))\n\n    controls, note = st.columns([1, 3])'''
          new = '''    metrics[3].metric("Spouse links", len(spouse_edges))\n\n    ordered = sorted_people(data["people"])\n    person_ids = [str(person["id"]) for person in ordered]\n    profile_picker, profile_action = st.columns([3, 1])\n    with profile_picker:\n        selected_profile = st.selectbox(\n            "Open a profile from the full map",\n            options=person_ids,\n            format_func=lambda person_id: (\n                f"{person_name(people_by_id, person_id)} · {life_span(people_by_id[person_id])}"\n            ),\n            key="full_map_profile_selector",\n        )\n    with profile_action:\n        st.write("")\n        st.button(\n            "Open selected profile",\n            on_click=open_profile,\n            args=(selected_profile,),\n            width="stretch",\n        )\n\n    controls, note = st.columns([1, 3])'''
          if text.count(old) != 1:
              raise SystemExit(f"Expected one full-map metrics anchor, found {text.count(old)}")
          app.write_text(text.replace(old, new, 1))

          tree = Path("full_tree.py")
          text = tree.read_text()
          old_help = "Drag to pan · use the wheel or +/− to zoom · click a profile to open it"
          new_help = "Drag to pan · use the wheel or +/− to zoom · click a profile to center it"
          if text.count(old_help) != 1:
              raise SystemExit(f"Expected one help label, found {text.count(old_help)}")
          text = text.replace(old_help, new_help, 1)

          old_click = '''  if (!node.unresolved) {{\n    g.addEventListener("click", () => {{\n      if (dragged) return;\n      const target = `${{window.parent.location.pathname}}?page=people&profile=${{encodeURIComponent(node.id)}}`;\n      window.parent.location.assign(target);\n    }});\n  }}'''
          new_click = '''  if (!node.unresolved) {{\n    g.addEventListener("click", () => {{\n      if (dragged) return;\n      select.value=node.id;\n      focusNode(node.id);\n    }});\n  }}'''
          if text.count(old_click) != 1:
              raise SystemExit(f"Expected one full-page click handler, found {text.count(old_click)}")
          tree.write_text(text.replace(old_click, new_click, 1))

          tests = Path("tests/test_full_tree.py")
          text = tests.read_text()
          old_assert = '''        self.assertIn("wheel", html)\n        self.assertNotIn("<script src=", html)'''
          new_assert = '''        self.assertIn("wheel", html)\n        self.assertNotIn("window.parent.location.assign", html)\n        self.assertNotIn("<script src=", html)'''
          if text.count(old_assert) != 1:
              raise SystemExit(f"Expected one full-tree interaction assertion, found {text.count(old_assert)}")
          tests.write_text(text.replace(old_assert, new_assert, 1))
          PY
      - name: Install dependencies
        run: python -m pip install --upgrade pip -r requirements.txt
      - name: Validate navigation safety
        run: |
          python -m compileall -q app.py family_data.py full_tree.py validation.py validate_data.py
          python validate_data.py
          python -m unittest discover -s tests -v
          ! grep -n "window.parent.location.assign" full_tree.py
      - name: Commit session-safe map and remove patch workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/final-map-navigation-safety.yml
          git add app.py full_tree.py tests/test_full_tree.py
          git diff --cached --check
          git commit -m "Keep full map navigation in the active session"
          git push origin HEAD:final/family-archive-hardening
