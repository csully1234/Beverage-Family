name: Apply source-first historical life expansion

on:
  push:
    branches:
      - research/historical-life-timeline-expansion
    paths:
      - .github/workflows/apply-historical-life-expansion.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: research/historical-life-timeline-expansion
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Apply historical profile and timeline research
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations
          import json
          from pathlib import Path

          ROOT = Path('.')
          DATA = ROOT / 'data'
          people_base = json.loads((DATA / 'people.json').read_text(encoding='utf-8'))
          people_path = DATA / 'research_people.json'
          people_overlay = json.loads(people_path.read_text(encoding='utf-8'))
          events_base = json.loads((DATA / 'events.json').read_text(encoding='utf-8'))
          events_path = DATA / 'research_events.json'
          events_overlay = json.loads(events_path.read_text(encoding='utf-8'))
          research_path = DATA / 'research.json'
          research = json.loads(research_path.read_text(encoding='utf-8'))

          base_people = {p['id']: p for p in people_base}
          overlay_people = {p['id']: p for p in people_overlay}
          base_events = {e['id']: e for e in events_base}
          overlay_events = {e['id']: e for e in events_overlay}
          research_by_id = {r['id']: r for r in research}
          accessed = '2026-08-31'

          def effective_person(pid):
              return {**base_people.get(pid, {}), **overlay_people.get(pid, {})}

          def unique(items):
              out = []
              seen = set()
              for item in items:
                  key = json.dumps(item, sort_keys=True, ensure_ascii=False) if isinstance(item, dict) else str(item)
                  if key not in seen:
                      seen.add(key)
                      out.append(item)
              return out

          def source(title, repository, url, record_type, supports, evidence_level, record_date=None):
              rec = {
                  'title': title,
                  'repository': repository,
                  'url': url,
                  'record_type': record_type,
                  'accessed': accessed,
                  'supports': supports,
                  'evidence_level': evidence_level,
              }
              if record_date:
                  rec['record_date'] = record_date
              return rec

          def patch_person(pid, *, add_lists=None, biography=None, notes=None, evidence_status=None, sources=None):
              if pid not in base_people and pid not in overlay_people:
                  raise RuntimeError(f'Unknown person: {pid}')
              current = effective_person(pid)
              rec = dict(overlay_people.get(pid, {'id': pid}))
              for field, values in (add_lists or {}).items():
                  rec[field] = unique(list(current.get(field, [])) + list(values))
              if biography:
                  prior = str(current.get('biography') or '').strip()
                  rec['biography'] = biography if not prior else prior + ' ' + biography
              if notes:
                  prior = str(current.get('notes') or '').strip()
                  rec['notes'] = notes if not prior else prior + ' ' + notes
              if evidence_status:
                  rec['evidence_status'] = evidence_status
              if sources:
                  rec['sources'] = unique(list(current.get('sources', [])) + list(sources))
              overlay_people[pid] = rec

          def add_event(record):
              eid = record['id']
              if eid in base_events or eid in overlay_events:
                  raise RuntimeError(f'Event already exists: {eid}')
              for key in ('date', 'title', 'description', 'people_involved', 'sources'):
                  if key not in record:
                      raise RuntimeError(f'{eid} missing {key}')
              overlay_events[eid] = record

          town_officers = source(
              'Vinalhaven Town Officers, 1790–1889',
              'Vinalhaven Centennial Committee, 1889; transcription at Maine Genealogy Archives',
              'https://archives.mainegenealogy.net/2007/01/vinalhaven-town-officers-1790-1889.html',
              'Published town-history office roster',
              'Annual town-clerk, treasurer, and selectman rosters including Thomas, John, Nathaniel, Benjamin, James and Josiah Beverage',
              'Tier 2/3 — near-contemporary municipal-history roster',
              '1889'
          )
          topsham = source(
              'History of Brunswick, Topsham, and Harpswell, Maine',
              'George Augustus Wheeler and Henry Warren Wheeler',
              'https://ldsgenealogy.com/ME/books/History-of-Brunswick-Topsham-and-Harpswell-Maine-including-the-ancient-territory-known-as-Pejepscot-part-18.htm',
              'Published town history using municipal records',
              'First Topsham town meeting on May 9, 1764 and election of James Beverage as hog constable',
              'Tier 2/3 — published local history reproducing municipal records',
              '1878'
          )
          mass_house = source(
              'Journal of the House of Representatives of the Commonwealth of Massachusetts, 1808',
              'Commonwealth of Massachusetts',
              'https://upload.wikimedia.org/wikipedia/commons/6/69/Journal_of_the_House_of_Representatives_of_the_Commonwealth_of_Massachusetts._%28IA_journalofhouseof1808mass%29.pdf',
              'Official legislative journal',
              'January 19, 1808 memorial of John Beverage and other Vinalhaven inhabitants opposing removal of Hancock County courts from Castine to Buckstown',
              'Tier 1 — official legislative record',
              '1808-01-19'
          )
          maine_constitution = source(
              'Constitution of Maine with 1819 Convention delegate list',
              'Maine Legislature',
              'https://legislature.maine.gov/uploads/originals/const1820.pdf',
              'Official constitutional convention record',
              'Benjamin Beverage listed as Vinalhaven delegate to the 1819 Maine Constitutional Convention',
              'Tier 1 — official state record',
              '1819'
          )
          benjamin_manuscript = source(
              'History of Vinalhaven, 1819',
              'Maine Historical Society via Maine Memory Network',
              'https://www.mainememory.net/record/20801',
              'Original manuscript letter',
              'Benjamin Beverage authored a December 20, 1819 manuscript describing Vinalhaven settlement, land distribution, vessels and religion',
              'Tier 1/2 — surviving original manuscript in institutional collection',
              '1819-12-20'
          )
          maine_house_1823 = source(
              'Civil Government of Maine, 1823',
              'Maine Legislature Law and Legislative Digital Library',
              'https://lldc.mainelegislature.org/Open/Laws/1823/Laws1823res_s0189-0195_CivGov.pdf',
              'Official state legislative record',
              'Benjamin Beverage represented Vinalhaven and neighboring islands in the Maine House of Representatives in 1823',
              'Tier 1 — official state record',
              '1823'
          )
          maine_house_1828 = source(
              'Pay Roll — House, 1828',
              'Maine Legislature Law and Legislative Digital Library',
              'https://lldc.mainelegislature.org/Open/Laws/1828/1828_RES_c064.pdf',
              'Official state legislative payroll',
              'Nathaniel Beverage listed as the Vinalhaven representative in the 1828 Maine House payroll',
              'Tier 1 — official state record',
              '1828'
          )
          bridge_act = source(
              'An act to establish the North Haven Bridge Company, Chapter 154',
              'Maine Legislature Law and Legislative Digital Library',
              'https://lldc.mainelegislature.org/Open/Laws/1848/1848_PS_c154.pdf',
              'Official state private and special law',
              'Authorization for a toll bridge over the head of Pulpit Harbor from Enos Cooper land to land of James and Josiah Beverage, at least 12 feet wide with a draw for vessels',
              'Tier 1 — official state law',
              '1848'
          )
          colby = source(
              'Second General Catalogue of the Officers and Graduates of Colby University, 1820–1887',
              'Colby University',
              'https://upload.wikimedia.org/wikipedia/commons/5/5a/Second_general_catalogue_of_the_officers_and_graduates_of_Colby_University%2C_Waterville%2C_Maine%2C_1820-1887_%28IA_secondgeneralcat01colb%29.pdf',
              'University catalogue',
              'Orris Lyford Beverage in the Class of 1887; contemporary alumni entry identifies him as principal of the high school at Hallowell',
              'Tier 2 — institutional publication',
              '1887'
          )
          frank_petition = source(
              'Congressional Record — House, 1912',
              'U.S. Government Publishing Office',
              'https://www.govinfo.gov/content/pkg/GPO-CRECB-1912-pt3-v48/pdf/GPO-CRECB-1912-pt3-v48-11.pdf',
              'Official Congressional Record',
              'Frank Beverage and other North Haven residents petitioned Congress for passage of the Kenyon-Sheppard interstate liquor bill',
              'Tier 1 — official federal record',
              '1912'
          )
          frank_bonds = source(
              'North Haven Water Loan Bonds notice',
              'Courier-Gazette, Rockland, Maine',
              'https://files01.core.ac.uk/download/pdf/270234656.pdf',
              'Contemporary newspaper legal/financial notice',
              'Frank Beverage, identified as North Haven treasurer, called specified town water-loan bonds for payment on August 23, 1926',
              'Tier 2/3 — contemporary public notice',
              '1926-08-23'
          )
          frank_auction = source(
              'Public Auction — Sands H. Witherspoon homestead, Pulpit Harbor',
              'Courier-Gazette, Rockland, Maine',
              'https://upload.wikimedia.org/wikipedia/commons/2/2a/Courier_Gazette_July_30_1927.pdf',
              'Contemporary newspaper advertisement',
              'Frank Beverage named as auctioneer for an August 24, 1927 Pulpit Harbor property sale',
              'Tier 2/3 — contemporary newspaper advertisement',
              '1927-08-24'
          )
          harold_ieee = source(
              'Harold H. Beverage',
              'IEEE Engineering and Technology History Wiki',
              'https://ethw.org/Harold_H._Beverage',
              'Professional institutional biography',
              'Early homemade wireless work, reception of signals from Carpathia after the Titanic disaster, education, radio research, RCA career and engineering honors',
              'Tier 2 — professional institutional archive'
          )
          gerald_obit = source(
              'Gerald Gibson Beverage obituary',
              'Bangor Daily News',
              'https://www.bangordailynews.com/2008/09/07/obituaries/gerald-gibson-beverage/',
              'Contemporary newspaper obituary',
              'North Haven schooling, University of Maine and Yale education, U.S. Navy Pacific service in World War II, Central Maine Power career, municipal and community leadership',
              'Tier 3 — detailed contemporary obituary',
              '2008-09-07'
          )
          samuel_obit = source(
              'Samuel Hiram Beverage obituary',
              'Tribute Archive / Riposta Funeral Home material',
              'https://www.tributearchive.com/obituaries/990096/Samuel-Hiram-Beverage',
              'Detailed obituary',
              '1941–45 Army Signal Corps service, July 16, 1942 overseas departure, Master Sergeant communications work across the Mediterranean theater, later Air Force service, radio career and North Haven Historical Society work',
              'Tier 3 — detailed obituary',
              '2014-12-18'
          )
          john_miller_obit = source(
              'John Miller Beverage obituary',
              'Tahlequah Daily Press',
              'https://obituaries.tahlequahdailypress.com/obituary/john-beverage-744038102',
              'Contemporary newspaper obituary',
              'Gordon College and Dallas Theological Seminary education, Guatemala missionary service, Dallas Seminary admissions/library career and church work',
              'Tier 3 — detailed contemporary obituary',
              '2011-07-25'
          )
          norwood_obit = source(
              'Norwood P. Beveridge Jr. obituary',
              'Legacy Remembers',
              'https://www.legacy.com/us/obituaries/legacyremembers/norwood-beveridge-obituary?id=8272014',
              'Published obituary',
              'Harvard education, corporate legal career, Oklahoma City University law professorship, retirement and death from COVID-19 on October 31, 2020',
              'Tier 3 — detailed published obituary',
              '2020-11-08'
          )
          arthur_obit = source(
              'Arthur Woodrow Beveridge obituary',
              'Connection Newspapers',
              'https://m.connectionnewspapers.com/news/2013/sep/19/obituary-arthur-woodrow-beveridge-70-springfield-m/',
              'Newspaper obituary',
              'Colby music education, music teaching and performance, Tae Kwon Do instruction, AB Records home studio and church music service',
              'Tier 3 — detailed newspaper obituary',
              '2013-09-19'
          )
          raymond_obit = source(
              'Raymond Albert Beverage obituary',
              'PenBay Pilot',
              'https://www.penbaypilot.com/article/raymond-albert-beverage-obituary/187215',
              'Contemporary local obituary',
              'North Haven carpentry and lobstering career, work in the island fleet through age 76, traditional knowledge and long service as groundskeeper/caretaker',
              'Tier 3 — detailed local obituary',
              '2024-06-03'
          )
          agnes_obit = source(
              'Agnes Beverage Dailey obituary',
              'Portland Press Herald',
              'https://www.pressherald.com/2018/11/30/agnes-beverage-dailey/',
              'Contemporary newspaper obituary',
              'Teaching career in several states and later Language Arts teaching at Brunswick Junior High School',
              'Tier 3 — contemporary newspaper obituary',
              '2018-11-30'
          )
          dorothy_obit = source(
              'Dorothy B. Brownell obituary',
              'The Lincoln County News',
              'https://lcnme.com/obituaries/dorothy-b-brownell/',
              'Contemporary newspaper obituary',
              'Seasonal agricultural work, homemaking, gardening/canning, Grange and church involvement and antique-car clubs',
              'Tier 3 — contemporary newspaper obituary',
              '2012-11-30'
          )
          estelle_obit = source(
              'Estelle Beverage Libby obituary',
              'PenBay Pilot',
              'https://www.penbaypilot.com/article/estelle-beverage-libby-obituary/271766',
              'Contemporary obituary',
              'One-room school and Camden High education, 4-H/Grange/community activity and 22-year MSAD #28 food-service career',
              'Tier 3 — contemporary obituary',
              '2026-06-26'
          )
          elsie_obit = source(
              'Elsie Beverage obituary',
              'Kincer Funeral Home',
              'https://www.kincerfuneralhome.com/2012-obituaries/942-elsie-beverage',
              'Funeral-home obituary',
              'Homemaking, sewing/alterations for income, doll-clothing work for Totsy Manufacturing, and husband Elroy V. Beverage Jr. returning from World War II Army service',
              'Tier 3 — detailed obituary',
              '2012-08-25'
          )
          hartley_obit = source(
              'Hartley George Beverage Sr. obituary',
              'PenBay Pilot',
              'https://www.penbaypilot.com/article/hartley-george-beverage-sr-obituary/102205',
              'Contemporary obituary',
              'Truck driving, commercial vegetable growing, poultry farming, Knox Woolen Mill work, Grange/Masonic leadership and Union Fire Department service',
              'Tier 3 — contemporary obituary',
              '2018-05-21'
          )
          florence_obit = source(
              'Florence Pearse Beverage obituary',
              'PenBay Pilot',
              'https://www.penbaypilot.com/article/florence-pearse-beverage-obituary/138141',
              'Contemporary obituary',
              'Work at GTE Sylvania, camp laundry, Union Upholstery, Knox Woolen Mill and the family poultry farm, plus Grange/church/community activities',
              'Tier 3 — contemporary obituary',
              '2020-09-04'
          )
          cynthia_obit = source(
              'Cynthia E. Tuplin obituary',
              'Riposta Funeral Home',
              'https://ripostafh.com/tribute/details/18429/Cynthia-Tuplin/obituary.html',
              'Funeral-home obituary',
              'Camden-Rockport High School Class of 1971 and practical carpentry/mechanical interests',
              'Tier 3 — detailed obituary',
              '2023-05-29'
          )
          sylvia_obit = source(
              'Sylvia Jean (Libby) Soucier obituary',
              'Carmon Funeral Home',
              'https://www.carmonfuneralhome.com/obituaries/Sylvia-Jean-Libby-Soucier?obId=20758314',
              'Funeral-home obituary',
              'Move from Appleton, Maine to Vernon, Connecticut in 1967, parish life and Salvation Army volunteer service',
              'Tier 3 — detailed obituary',
              '2021-04-08'
          )

          # Early municipal and state public-service generation.
          patch_person('james_beveridge_jr_1724',
              add_lists={'civic_offices': ['Topsham hog constable, elected at the first town meeting, May 9, 1764', 'Topsham selectman, 1774–1775']},
              biography='Municipal records reproduced in a nineteenth-century Topsham history place James Beverage in the town’s first formal government: he was elected hog constable at the first town meeting in 1764 and later served as a selectman in 1774 and 1775.',
              evidence_status='Strongly supported civic history — published Topsham history reproduces early municipal records',
              sources=[topsham])

          patch_person('thomas_beverage_1750',
              add_lists={'civic_offices': ['Vinalhaven town clerk, 1790–1798', 'Vinalhaven selectman, 1797']},
              biography='The Vinalhaven centennial town-officer roster shows Thomas Beverage as the town clerk for nine consecutive years, 1790 through 1798, and also as a selectman in 1797, documenting a sustained role in the government of the island community.',
              evidence_status='Strongly supported public service — near-contemporary Vinalhaven office roster',
              sources=[town_officers])

          patch_person('john_white_beverage_1774',
              add_lists={'civic_offices': ['Vinalhaven town clerk, 1799–1812']},
              biography='John Beverage succeeded Thomas Beverage as Vinalhaven town clerk and appears in the annual office roster for fourteen consecutive years, 1799–1812. In January 1808, the Massachusetts House received a memorial from John Beverage and other Vinalhaven inhabitants opposing a proposed removal of Hancock County courts from Castine to Buckstown.',
              evidence_status='Verified/strongly supported civic activity — official legislative journal plus near-contemporary town roster',
              sources=[town_officers, mass_house])

          patch_person('nathaniel_winslow_beverage_1776',
              add_lists={'civic_offices': ['Vinalhaven treasurer, 1813–1819', 'Vinalhaven selectman, 1812, 1818 and 1828', 'Maine House of Representatives, Vinalhaven, 1828']},
              biography='Nathaniel Beverage held repeated local office in Vinalhaven and then represented the town in the Maine House in 1828; the official House payroll records him as the Vinalhaven representative.',
              evidence_status='Verified/strongly supported public service — official Maine House record plus town-office roster',
              sources=[town_officers, maine_house_1828])

          patch_person('benjamin_kent_beverage_1779',
              add_lists={'civic_offices': ['Vinalhaven selectman, 13 annual listings between 1806 and 1822', 'Delegate, Maine Constitutional Convention, 1819', 'Maine House of Representatives, 1823'],
                         'accomplishments': ['Authored a surviving December 20, 1819 manuscript history of Vinalhaven now held in the William D. Williamson papers at the Maine Historical Society']},
              biography='Benjamin Beverage combined local government, state formation and historical writing. Vinalhaven’s office roster lists him as a selectman in thirteen years between 1806 and 1822. Maine’s constitutional record names him as Vinalhaven’s delegate to the 1819 convention, and the Maine Historical Society preserves his December 20, 1819 manuscript account of Vinalhaven settlement, land distribution, vessels and religion. He later represented Vinalhaven and surrounding islands in the Maine House in 1823.',
              evidence_status='Verified/strongly supported — official state records, surviving manuscript and town roster',
              sources=[town_officers, maine_constitution, benjamin_manuscript, maine_house_1823])

          patch_person('james_beverage_1789',
              add_lists={'civic_offices': ['Vinalhaven selectman, 1833, 1834 and 1842']},
              biography='The 1889 Vinalhaven town-history roster independently documents James Beverage as a selectman in 1833, 1834 and 1842. An 1848 Maine law also identifies land of James and Josiah Beverage at the head of Pulpit Harbor as one terminus of a state-authorized toll bridge, providing unusually specific evidence of the family’s property context.',
              evidence_status='Strongly supported civic/property context; the separate tannery-mercury death tradition remains uncorroborated',
              sources=[town_officers, bridge_act])

          patch_person('josiah_winslow_beverage_1793',
              add_lists={'civic_offices': ['Vinalhaven selectman, 1846']},
              biography='Josiah Beverage appears as a Vinalhaven selectman in 1846. Two years later, a Maine legislative act described land of James and Josiah Beverage at the head of Pulpit Harbor as the proposed terminus of the North Haven Bridge Company toll bridge.',
              evidence_status='Verified/strongly supported civic/property context — town roster and official state law',
              sources=[town_officers, bridge_act])

          patch_person('harrison_beverage_1825',
              add_lists={'civic_offices': ['Maine House representative associated with North Haven, 1859', 'Justice in North Haven; state register records appointments including April 29, 1885']},
              biography='In addition to his already documented 1859 representative service, state-era records place Harrison Beverage among North Haven’s local justices later in life, illustrating a long span of public service.',
              evidence_status='Strong civic-service record; representative service and later justice role documented in historical state/town publications',
              sources=[town_officers])

          # Education, business, public-finance and professional histories.
          patch_person('orris_beverage_1860',
              add_lists={'occupations': ['Educator', 'High school principal'], 'education': ['Colby University, Class of 1887 (A.B.; later references also style him A.M.)']},
              biography='Colby University’s 1887 catalogue places Orris Lyford Beverage in the Class of 1887 and identifies him as principal of the high school in Hallowell, Maine. Later professional references describe a career as a school principal, giving documentary substance to the archive’s earlier note that he was an education advocate.',
              evidence_status='Strongly supported education/career — contemporary university catalogue',
              sources=[colby])

          patch_person('frank_beverage_1861',
              add_lists={'occupations': ['Auctioneer'], 'civic_offices': ['Treasurer, Town of North Haven, documented 1926'], 'accomplishments': ['Joined other North Haven residents in a 1912 petition to Congress supporting the Kenyon-Sheppard interstate liquor bill']},
              biography='Frank Beverage’s later public record extends well beyond his butcher and hides/wool businesses. The Congressional Record lists him among North Haven petitioners on federal liquor legislation in 1912; a 1926 public notice identifies him as town treasurer handling North Haven water-loan bonds; and a 1927 newspaper advertisement names him auctioneer for a Pulpit Harbor property sale.',
              evidence_status='Verified/strongly supported civic/business activity — federal record and contemporary newspapers',
              sources=[frank_petition, frank_bonds, frank_auction])

          patch_person('harold_h_beverage_1893',
              add_lists={'accomplishments': ['As a teenager, used a homemade wireless station to receive signals from Carpathia after the Titanic disaster, according to IEEE’s institutional biography']},
              biography='IEEE’s institutional biography records an unusually vivid early-radio episode: as a teenager on North Haven, Harold Beverage built a homemade wireless station and received signals from Carpathia after it rescued Titanic survivors, years before his professional work on long-distance radio and the Beverage antenna.',
              sources=[harold_ieee])

          patch_person('gerald_gibson_beverage_1914',
              add_lists={'education': ['North Haven High School, Class of 1932', 'University of Maine, general engineering, 1936', 'Yale Law School, 1942'],
                         'military_service': ['U.S. Navy, December 1942–late 1945; Pacific Theater service reported in campaigns including Kwajalein, Saipan, Guam, the Philippines and Iwo Jima; released as lieutenant'],
                         'occupations': ['Attorney', 'Central Maine Power claims and right-of-way executive'],
                         'civic_offices': ['President, Augusta City Council', 'Chair, Lithgow Library Trustees', 'Chair, Augusta Sanitary District Commissioners', 'Board leadership, Augusta General Hospital'],
                         'accomplishments': ['Boy Scouts of America Silver Beaver Award']},
              biography='Gerald G. Beverage combined engineering, law, wartime naval service and decades of Maine civic leadership. After North Haven High School, the University of Maine and Yale Law School, he entered the Navy in December 1942 and served in the Pacific. He later spent his career with Central Maine Power in claims, rights-of-way, real estate and management, while serving Augusta through the city council, library, sanitary district, hospital, church and Scouting.',
              evidence_status='Strongly supported life history — detailed contemporary newspaper obituary',
              sources=[gerald_obit])

          patch_person('samuel_hiram_beverage_1917',
              add_lists={'military_service': ['Drafted June 1941; U.S. Army Signal Corps, Master Sergeant and Radio/Communications Chief, 1060th Signal Company, 323rd Air Service Group; overseas July 16, 1942–May 1945 in Libya, Tunisia, Egypt, Lebanon, Palestine and Italy', 'European-African-Middle Eastern service medal with three Bronze Campaign Stars, as reported in obituary', 'U.S. Air Force, June 1947–June 1950'],
                         'occupations': ['National Radio Company employee, 1950–1970'],
                         'civic_offices': ['Instrumental with Lewis and Ida Haskell in establishing the North Haven Historical Society after returning permanently to the island in 1973']},
              biography='Samuel Hiram Beverage’s obituary preserves a detailed communications-service history: drafted in 1941, he departed New York on July 16, 1942 and served as a Master Sergeant and radio/communications chief with the 1060th Signal Company, 323rd Air Service Group across North Africa, the Middle East and Italy. After later Air Force service and a career at National Radio Company, he returned permanently to North Haven in 1973 and helped establish the North Haven Historical Society.',
              sources=[samuel_obit])

          patch_person('john_miller_beverage_1927',
              add_lists={'education': ['Gordon College, 1949', 'Dallas Theological Seminary, 1953', 'Master of Library Science, North Texas State University, 1983'],
                         'occupations': ['Missionary in Guatemala', 'Dallas Theological Seminary admissions administrator', 'Public-services librarian'],
                         'civic_offices': ['Church elder; library, choir and adult Sunday-school service']},
              biography='After Gordon College and Dallas Theological Seminary, John Miller Beverage was appointed by Central American Mission and served as a missionary in Guatemala until 1972. He then worked at Dallas Theological Seminary in admissions and library service, later earning a library-science master’s degree and remaining active in church leadership.',
              evidence_status='Strongly supported education, missionary and professional history — contemporary obituary',
              sources=[john_miller_obit])

          patch_person('norwood_pierson_beveridge_jr_1936',
              add_lists={'education': ['Harvard College, 1958', 'Harvard Law School, 1962', 'LL.M., New York University'],
                         'occupations': ['Corporate attorney / chief legal officer, Amerace Corporation', 'Law professor, Oklahoma City University']},
              biography='Norwood Pierson Beveridge Jr. graduated from Harvard College and Harvard Law School, later earned an LL.M. at New York University, served as chief legal officer of Amerace Corporation in New York, and became a law professor at Oklahoma City University. His obituary states that he died from COVID-19 on October 31, 2020.',
              evidence_status='Strongly supported education/career and cause of death — detailed published obituary',
              sources=[norwood_obit])

          patch_person('arthur_woodrow_beveridge_1943',
