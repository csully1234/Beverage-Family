name: Apply historical life research

on:
  push:
    branches:
      - research/historical-life-timeline-expansion
    paths:
      - .github/workflows/apply-historical-life-expansion.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: research/historical-life-timeline-expansion
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Execute reviewed historical research payload
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap
          payload = Path('research/historical_apply_source.txt').read_text(encoding='utf-8')
          start = "python - <<'PY'\n"
          end = "\n          PY\n"
          script = payload.split(start, 1)[1].split(end, 1)[0]
          exec(compile(textwrap.dedent(script), 'historical_apply_payload.py', 'exec'))
          PY
      - name: Install dependencies and validate
        run: |
          python -m pip install -r requirements.txt
          python validate_data.py
          python -m unittest discover -s tests -v
      - name: Commit reviewed results and remove temporary helpers
        run: |
          rm -f .github/workflows/apply-historical-life-expansion.yml
          rm -f research/historical_apply_source.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Expand historical life stories and timeline'
          git push origin HEAD:research/historical-life-timeline-expansion
